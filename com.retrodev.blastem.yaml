app-id: com.retrodev.blastem
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: blastem
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Play sounds
  - --socket=pulseaudio
  # Joystick and GPU access
  - --device=all
modules:
  - shared-modules/glu/glu-9.json
  - shared-modules/glew/glew.json
  - name: libportal
    buildsystem: meson
    config-opts:
      - -Dbackend-gtk3=disabled
      - -Dbackend-gtk4=disabled
      - -Dbackend-qt5=disabled
      - -Dbackend-qt6=disabled
      - -Dintrospection=false
      - -Dvapi=false
      - -Ddocs=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://github.com/flatpak/libportal/archive/0.10.0.tar.gz
        sha256: e1b6913c6d9015bfa918ace86f82c30940982add97aed9c18cc929c5327054fd
        x-checker-data:
          type: anitya
          project-id: 230124
          stable-only: true
          url-template: https://github.com/flatpak/libportal/archive/$version.tar.gz
  - name: blastem
    buildsystem: simple
    build-commands:
      - DATA_PATH=/app/share/blastem/ CONFIG_PATH=/app/etc/ make blastem -j $FLATPAK_BUILDER_N_JOBS
      - install -m0755 -D blastem /app/bin/blastem.bin
      - install -m0755 -D blastem.sh /app/bin/blastem
      - install -d /app/share/blastem/
      - cp -r shaders/ images/ gamecontrollerdb.txt rom.db systems.cfg /app/share/blastem/
      - install -m0644 -D default.cfg -t /app/etc/
      - install -m0644 -D ${FLATPAK_ID}.png -t /app/share/icons/hicolor/256x256/apps/
      - install -m0644 -D com.retrodev.blastem.desktop -t /app/share/applications/
      - install -m0644 -D com.retrodev.blastem.metainfo.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://www.retrodev.com/repos/blastem/archive/732f5689d438.tar.bz2
        sha256: bf7e0271d83c5ac99e6cfe763e4f6d5f23181dad32e3c5858c1d0bf90d2aeac7
      - type: script
        dest-filename: blastem.sh
        commands:
          - mkdir -p $XDG_CONFIG_HOME/blastem/ $XDG_DATA_HOME/blastem
          - exec /app/bin/blastem.bin "$@"
      - type: patch
        paths:
          - 0001-Add-support-for-Flatpak-config-data-dir-variables.patch
          - 0002-Add-a-native-filechooser-based-on-XDG-s-file-chooser.patch
          - 0003-Replace-the-GTK-filechooser-with-the-XDG-filechooser.patch
          - 0004-Set-use_native_filechooser-to-be-on-by-default.patch
          - 0005-Add-filetype-filters-to-the-XDG-file-chooser.patch
          - 0006-Force-native-file-chooser-on.patch
          - 0007-Add-more-file-patterns-to-filters.patch
      - type: file
        path: com.retrodev.blastem.png
      - type: file
        path: com.retrodev.blastem.desktop
      - type: file
        path: com.retrodev.blastem.metainfo.xml
